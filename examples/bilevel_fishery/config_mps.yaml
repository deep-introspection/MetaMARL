experiment:
  name: bilevel_fishery
  seed: 0

ray:
  device: mps
  num_cpus: 4
  omp_threads: 1
  logging_level: ERROR

world:
  world_name: fishery_world

mechanism:
  space: FisheryMechanismSpace
  scaling:
    max_fine: 10.0
    max_ban: 200
  default:
    fixed_quota: 0.5
    prop_quota: 0.4
    min_stock: 0.15
    fine_amount: 0.5
    ban_period: 5

training:
  outer_iters: 100

outer:
  optimizer: ES
  training:
    sigma: 0.5
    mean_lr: 0.2
    sigma_lr: 0.05
    min_sigma: 0.01
    max_sigma: 0.6
  environment:
    env: FisheryRegulatorEnv
    horizon: 500
    train_iters: 100
    env_config:
      ecology_cfg:
        sus_weight: 1.0
        sus_threshold: 0.1

inner:
  optimizer: PPO
  resources:
    num_cpus_for_main_process: 1

  framework:
    framework: torch

  model:
    custom_model: mps_fcnet

  api_stack:
    enable_rl_module_and_learner: false
    enable_env_runner_and_connector_v2: false

  environment:
    env: FisheryRegulatedEnv
    horizon: 1000
    env_config:
      ecology_cfg:
        algae_init: 1.0
        fish_init: 1.0
        max_fish: 5.0
        max_algae: 5.0
        alpha: 0.5 # algae growth rate
        beta: 0.1  # algae consumption by fish
        delta: 0.2 # fish growth from eating algae
        gamma: 0.4 # fish natural death rate
        dt: 0.01
      seed: 0

  env_runners:
    num_env_runners: 1
    num_cpus_per_env_runner: 1
    num_gpus_per_env_runner: 0
    num_envs_per_env_runner: 16
    rollout_fragment_length: 1000
    batch_mode: complete_episodes

  learners:
    num_learners: 0
    num_gpus_per_learner: 0

  training:
    gamma: 0.95
    lr: 0.001
    train_batch_size: 16000
    minibatch_size: 1024

  evaluation:
    evaluation_interval: null
    evaluation_duration: 16000
    evaluation_duration_unit: timesteps
    evaluation_num_env_runners: 1
    evaluation_config:
      explore: false
      seed: 42
      num_envs_per_env_runner: 16
      rollout_fragment_length: 1000
      batch_mode: complete_episodes

  agents:
    fisher:
      count: 3
      policy: fisher_policy
      observation_space:
        type: box
        low: -inf
        high: inf
        shape: [5, mechanism_dim]
      action_space:
        type: box
        low: 0.0
        high: 1.0
        shape: [1]

  fault_tolerance:
    restart_failed_env_runners: false