experiment:
  name: bilevel_fishery
  seed: 0

ray:
  device: cpu
  num_cpus: 4
  omp_threads: 1
  logging_level: ERROR
  runtime_env:
    excludes:
      - wandb/
      - .git/
      - .venv/
      - __pycache__/
      - ray_results/
      - runs/

world:
  world_name: fishery_world

mechanism:
  space: FisheryMechanismSpace
  default:
    fixed_quota: 1.0
    prop_quota: 1.0
    min_stock: 0.10
    fine_amount: 3.0
    ban_period: 0
    catch_prob: 0.3

training:
  outer_iters: 100

outer:
  optimizer: ES
  training:
    sigma: 0.3
    mean_lr: 0.1
    sigma_lr: 0.05
    min_sigma: 0.001
    max_sigma: 0.5
  environment:
    env: FisheryRegulatorEnv
    horizon: 200
    train_iters: 50
    env_config:
      ecology_cfg:
        sus_weight: 1.0
        sus_threshold: 0.1
        max_fish: 2.0
        max_algae: 2.0

inner:
  optimizer: PPO
  resources:
    num_cpus_for_main_process: 1

  framework:
    framework: torch

  model:
    custom_model: null

  api_stack:
    enable_rl_module_and_learner: false
    enable_env_runner_and_connector_v2: false

  environment:
    env: FisheryRegulatedEnv
    horizon: 200
    env_config:
      ecology_cfg:
        algae_init: 1.0
        fish_init: 0.5
        max_fish: 2.0
        max_algae: 2.0
        alpha: 0.5
        beta: 0.1
        delta: 0.2
        gamma: 0.4
        dt: 0.01
      seed: 0

  env_runners:
    num_env_runners: 1
    num_cpus_per_env_runner: 1
    num_gpus_per_env_runner: 0
    num_envs_per_env_runner: 16
    rollout_fragment_length: 200
    batch_mode: complete_episodes

  learners:
    num_learners: 0
    num_gpus_per_learner: 0

  training:
    gamma: 0.99
    lr: 0.0003
    train_batch_size: 3200
    minibatch_size: 512

  evaluation:
    evaluation_interval: null
    evaluation_duration: 1000
    evaluation_duration_unit: timesteps
    evaluation_num_env_runners: 1
    evaluation_config:
      explore: false
      seed: 1234
      num_envs_per_env_runner: 16
      rollout_fragment_length: 125
      batch_mode: complete_episodes

  agents:
    fisher:
      count: 3
      policy: fisher_policy
      observation_space:
        type: box
        low: -inf
        high: inf
        shape: [5, mechanism_dim]
      action_space:
        type: box
        low: 0.0
        high: 1.0
        shape: [1]

  fault_tolerance:
    restart_failed_env_runners: false