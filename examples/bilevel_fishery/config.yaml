# Bilevel Fishery Optimization Configuration
# This file contains all hyperparameters for the fishery bilevel optimization.

# Bilevel optimization settings
bilevel:
  outer_iterations: 10
  random_seed: 0

# Evolution Strategies (outer loop)
es:
  population_size: 16
  sigma: 0.15
  lr_mean: 0.1
  lr_sigma: 0.05
  min_sigma: 0.001
  max_sigma: 0.5

# PPO training (inner loop)
ppo:
  inner_iterations: 100
  gamma: 0.99
  train_batch_size: 4000
  minibatch_size: 512
  lr: 0.0003
  framework: torch

# Environment
environment:
  num_fishermen: 3
  horizon: 200

# Ecology (Lotka-Volterra)
ecology:
  alpha: 1.0      # Algae growth rate
  beta: 0.5       # Algae consumption by fish
  delta: 0.5      # Fish growth from algae
  gamma: 1.0      # Fish natural death rate
  dt: 0.05
  algae_init: 1.0
  fish_init: 0.5

# Evaluation
evaluation:
  episodes: 5
  sustainability_weight: 5.0
  sustainability_threshold: 0.1

# Logging
logging:
  log_dir: runs
  wandb_project: bilevel-fishery
