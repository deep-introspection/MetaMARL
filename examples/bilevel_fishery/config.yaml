# ============================================================
# BilevelFishery — Default experiment configuration (V0)
#
# This config runs the bilevel optimisation loop with:
#   - Outer loop: Evolution Strategies (ES) searching for regulatory mechanisms
#   - Inner loop: PPO training 3 fishing agents under the proposed mechanism
#   - Mechanism: V0 binary fine/ban enforcement
#
# Run with:
#   ./run.sh
#   ./run.sh examples/bilevel_fishery/config.yaml
# ============================================================

experiment:
  name: bilevel_fishery   # Tag for this run; appears in logs and output folders
  seed: 0                 # Global random seed for reproducibility

# ------------------------------------------------------------
# Ray cluster configuration
# Ray is used to parallelise both the ES population evaluation
# and the APPO rollout workers.
# ------------------------------------------------------------
ray:
  device: cpu             # Compute device: "cpu" or "gpu". Use "gpu" only if CUDA is available
  num_cpus: 4             # Total CPU cores allocated to the Ray cluster
  omp_threads: 1          # OpenMP threads per worker. Keep at 1 to avoid CPU over-subscription
  logging_level: ERROR    # Ray log verbosity: ERROR (quiet), WARNING, INFO, DEBUG
  runtime_env:
    excludes:
      # Directories excluded from Ray's file sync to remote workers.
      # Exclude large or irrelevant folders to keep sync fast.
      - wandb/
      - .git/
      - .venv/
      - __pycache__/
      - ray_results/
      - runs/

# ------------------------------------------------------------
# World
# The world abstraction manages the shared context bus between
# the inner and outer loops.
# ------------------------------------------------------------
world:
  world_name: fishery_world   # Must match a registered world class in core/world/

# ------------------------------------------------------------
# Mechanism (V0: binary fine/ban enforcement)
#
# The mechanism is the vector of regulatory rules that ES
# searches over. V0 uses a quota/fine/ban scheme.
#
# ES operates on a normalised [0, 1] version of this vector.
# The "scaling" block sets the de-normalisation factors.
# The "default" block sets fixed parameter values; in V0 the
# optimize_params list is currently empty, so all parameters
# remain fixed at these defaults (single-mechanism evaluation).
# ------------------------------------------------------------
mechanism:
  space: FisheryMechanismSpace   # V0 mechanism class (resolves via the component registry)
  scaling:
    max_fine: 30.0    # Upper bound on fine_amount. fine_amount is divided by this for normalisation
    max_ban: 200      # Upper bound on ban_period (in steps). Divided by this for normalisation
  default:
    fixed_quota: 1.0    # Hard harvest cap per agent per step [0, 1], as a fraction of max_fish.
                        # 1.0 = agents can harvest up to their full fish_norm each step
    prop_quota: 1.0     # Proportional quota multiplier [0, 1]. Effective quota =
                        # min(fixed_quota, prop_quota * fish_norm). Tightens cap when stock is low
    min_stock: 0.10     # Normalised stock floor [0, 1]. Fishing is prohibited when
                        # fish / max_fish < min_stock
    fine_amount: 15.0   # Penalty magnitude [0, max_fine]. Fine = fine_amount * violation_size
    ban_period: 0       # Steps an agent is banned after a detected violation [0, max_ban].
                        # 0 = no ban (fine only)
    catch_prob: 0.1     # Probability [0, 1] that a violation is detected at any given step.
                        # 0.1 = stochastic enforcement (10% detection rate)

# ------------------------------------------------------------
# Training schedule
# ------------------------------------------------------------
training:
  outer_iters: 100   # Number of ES generations to run. Each generation evaluates
                     # the full ES population of mechanism candidates

# ------------------------------------------------------------
# Outer loop: Evolution Strategies (ES) — the regulator
#
# ES proposes a population of mechanism candidates, evaluates
# each by running the inner RL loop, then updates the search
# distribution based on the resulting fitness scores.
# ------------------------------------------------------------
outer:
  optimizer: ES   # Only "ES" is supported for the outer loop

  training:
    sigma: 0.3        # Initial standard deviation of the ES search distribution.
                      # Controls the radius of exploration in mechanism space.
                      # Larger = broader search, smaller = finer local search
    mean_lr: 0.1      # Step size for updating the ES distribution mean toward better mechanisms
    sigma_lr: 0.05    # Step size for adapting sigma (the exploration radius) over training
    min_sigma: 0.001  # Floor on sigma. Prevents the search from collapsing to a single point
    max_sigma: 0.5    # Ceiling on sigma. Prevents unbounded exploration

  environment:
    env: FisheryRegulatorEnv   # Outer-loop Gymnasium environment class name
    horizon: 200               # Number of inner-loop steps used to evaluate each mechanism
    train_iters: 50            # APPO training iterations run per mechanism evaluation.
                               # More = agents learn better under each mechanism, but slower ES
    env_config:
      ecology_cfg:
        sus_weight: 1.0       # Weight on the sustainability penalty in the fitness function:
                              # fitness = mean_reward - sus_weight * sustainability_penalty
        sus_threshold: 0.1    # Normalised fish stock level considered a "collapse" event.
                              # Steps below this threshold penalise the fitness score
        max_fish: 2.0         # Fish carrying capacity. Used to de-normalise trajectories
                              # for visualisation (does not affect training dynamics here)
        max_algae: 2.0        # Algae carrying capacity. Used for de-normalisation only

# ------------------------------------------------------------
# Inner loop: PPO — the fishing agents
#
# PPO trains N fishing agents who each learn how to harvest
# fish under the current mechanism to maximise their reward.
# Agents share a single policy (parameter sharing).
# ------------------------------------------------------------
inner:
  optimizer: PPO   # Inner-loop RL algorithm. "PPO" (synchronous) or "APPO" (asynchronous)

  resources:
    num_cpus_for_main_process: 1   # CPUs reserved for the RLlib trainer process

  framework:
    framework: torch   # Deep learning backend: "torch" or "tf2"

  model:
    custom_model: null   # Set to a registered model name (e.g. "mps_fcnet") to use a custom
                         # network architecture. null = use RLlib's default MLP

  api_stack:
    # RLlib API version selection. V0 uses the legacy (stable) API stack.
    enable_rl_module_and_learner: false          # Set true to use the new RLlib Module API
    enable_env_runner_and_connector_v2: false    # Set true to use the new Connector/EnvRunner API

  environment:
    env: FisheryRegulatedEnv   # V0 inner-loop environment class (binary fine/ban enforcement)
    horizon: 200               # Episode length in steps. Each step advances the ecology by dt
    env_config:
      ecology_cfg:
        algae_init: 1.0   # Initial algae biomass at episode start (before log-normal jitter)
        fish_init: 0.5    # Initial fish biomass at episode start (before log-normal jitter)
        max_fish: 5.0     # Fish carrying capacity (biomass ceiling). Normalises fish observations
        max_algae: 5.0    # Algae carrying capacity. Normalises algae observations

        # Lotka-Volterra parameters — govern predator-prey dynamics:
        # dX/dt = delta * X * Y  -  gamma * X  -  H(t)   [fish]
        # dY/dt = alpha * Y  -  beta * Y * X              [algae]
        alpha: 0.5   # Intrinsic algae growth rate. Higher = algae recovers faster
        beta: 0.1    # Rate fish consume algae. Higher = algae depleted faster
        delta: 0.2   # Fish growth rate from eating algae. Higher = fish grow faster when algae abundant
        gamma: 0.4   # Natural fish mortality rate. Higher = fish die faster without food
        dt: 0.01     # Euler integration step size. Smaller = more accurate dynamics, slower simulation.
                     # With horizon=200 and dt=0.01, each episode simulates 2.0 time units
      seed: 0        # RNG seed for the inner environment (episode resets, stochastic enforcement)

  # Environment runners handle data collection (rollouts).
  env_runners:
    num_env_runners: 1            # Parallel rollout workers. 0 = run in main process
    num_cpus_per_env_runner: 1    # CPUs per rollout worker
    num_gpus_per_env_runner: 0    # GPUs per rollout worker (0 for CPU-only)
    num_envs_per_env_runner: 16   # Parallel environment copies per worker. Increases throughput
    rollout_fragment_length: 200  # Steps collected per fragment before sending to the learner
    batch_mode: complete_episodes # "complete_episodes" waits for a full episode before cutting.
                                  # Use "truncate_episodes" to cut exactly at rollout_fragment_length

  # Learners handle gradient updates.
  learners:
    num_learners: 0        # 0 = training runs on the main process (simpler). 1+ = separate learner workers
    num_gpus_per_learner: 0

  # PPO training hyperparameters
  training:
    gamma: 0.99              # Discount factor for future rewards. Values near 1.0 encourage
                             # long-term thinking — important for sustainable fishing behaviour
    lr: 0.0003               # Policy network learning rate (Adam optimiser)
    train_batch_size: 3200   # Total environment steps per training batch
    minibatch_size: 512      # Steps per gradient update within a batch. Smaller = noisier but
                             # more frequent updates

  # Evaluation runs the trained policy in deterministic mode to measure final performance.
  evaluation:
    evaluation_interval: null      # null = disable periodic evaluation during training
    evaluation_duration: 1000      # Steps used for each evaluation run
    evaluation_duration_unit: timesteps
    evaluation_num_env_runners: 1
    evaluation_config:
      explore: false               # Greedy actions during evaluation (no stochastic sampling)
      seed: 1234                   # Fixed seed for reproducible evaluation episodes
      num_envs_per_env_runner: 16
      rollout_fragment_length: 125
      batch_mode: complete_episodes

  # Agent definitions. "fisher" is the only agent type.
  agents:
    fisher:
      count: 3           # Number of fishing agents. All share a single policy
      policy: fisher_policy
      observation_space:
        type: box
        low: -inf
        high: inf
        shape: [5, mechanism_dim]   # 5 base features + mechanism vector dimension (6 for V0)
      action_space:
        type: box
        low: 0.0    # Minimum harvest fraction
        high: 1.0   # Maximum harvest fraction (scales with current fish stock)
        shape: [1]  # Single continuous action

  fault_tolerance:
    restart_failed_env_runners: false   # Do not auto-restart crashed workers (fail loudly)
