world:
  world_name: fishery_world

reporting:
  reporter: wandb
  project_name: MetaMARL
  settings_dict:
    x_disable_stats: true
    x_disable_meta: true
    quiet: true
    max_end_of_run_summary_metrics: 0
    max_end_of_run_history_metrics: 0

mechanism:
  space: FisheryMechanismSpaceV1
  scaling:
    max_fine: 10.0
  default:
    fixed_quota: 0.25
    prop_quota: 0.25
    min_stock: 0.40
    target_stock: 0.60
    fine_amount: 10.0
    risk_penalty_scale: 8.0
    risk_penalty_power: 2.0

training:
  outer_iters: 100

ray:
  device: cpu
  num_cpus: 4
  omp_threads: 1
  logging_level: ERROR

outer:
  optimizer: ES
  training:
    sigma: 0.5
    mean_lr: 0.2
    sigma_lr: 0.05
    min_sigma: 0.01
    max_sigma: 0.6
  environment:
    env: FisheryRegulatorEnv
    env_config:
      ecology_cfg:
        sus_weight: 1.0
        sus_threshold: 0.1
    horizon: 1000
    train_iters: 1000

inner:
  optimizer: APPO

  resources:
    num_cpus_for_main_process: 1

  framework:
    framework: torch

  api_stack:
    enable_rl_module_and_learner: true
    enable_env_runner_and_connector_v2: true

  environment:
    env: FisheryRegulatedEnvV1
    env_config:
      ecology_cfg:
        algae_init: 1.0
        fish_init: 2.5
        max_fish: 5.0
        max_algae: 5.0
        alpha: 0.5
        beta: 0.1
        delta: 0.5
        gamma: 0.4
        dt: 0.1
      seed: 0
    horizon: 1000
    disable_env_checking: false

  env_runners:
    num_env_runners: 0
    num_cpus_per_env_runner: 1
    num_gpus_per_env_runner: 0
    num_envs_per_env_runner: 1
    rollout_fragment_length: 500
    batch_mode: truncate_episodes

  learners:
    num_learners: 1
    num_gpus_per_learner: 0

  callbacks:
    on_episode_created: tag_episode_with_env_idx

  training:
    vtrace: true
    circular_buffer_num_batches: 4
    circular_buffer_iterations_per_batch: 1
    broadcast_interval: 1
    timeout_s_sampler_manager: 300
    timeout_s_aggregator_manager: 300
    gamma: 0.99
    lr: 0.001
    train_batch_size: 4000
    minibatch_size: 500
    entropy_coeff: 0.001
    grad_clip: 40.0

  evaluation:
    evaluation_interval: null
    evaluation_duration: 1000
    evaluation_duration_unit: timesteps
    evaluation_num_env_runners: 1
    evaluation_config:
      explore: false
      seed: 42
      num_envs_per_env_runner: 1
      rollout_fragment_length: 1000
      batch_mode: complete_episodes
      minibatch_size: null

  agents:
    fisher:
      count: 3
      policy: fisher_policy
      observation_base_dim: 4
      action_space:
        low: 0.0
        high: 1.0
        shape: [1]

  fault_tolerance:
    restart_failed_env_runners: false