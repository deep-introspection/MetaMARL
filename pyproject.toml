[project]
name = "bilevel-fishery"
version = "0.1.0"
description = "Bilevel optimization framework for sustainable fishery management using Evolution Strategies"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Guillaume Dumas", email = "guillaume.dumas@umontreal.ca"}
]
keywords = ["bilevel-optimization", "reinforcement-learning", "sustainability", "mechanism-design", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium==1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "ray[rllib]==2.50.1",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "torchvision>=0.24.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[project.urls]
Homepage = "https://github.com/deep-introspection/bilevel-fishery"
Repository = "https://github.com/deep-introspection/bilevel-fishery"
Issues = "https://github.com/deep-introspection/bilevel-fishery/issues"
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "ray[rllib]>=2.40.0,<3.0.0",
    "gymnasium>=0.29.0,<2.0.0",
    "torch>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "wandb>=0.15.0,<1.0.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
