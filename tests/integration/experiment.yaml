experiment:
  world:
    name: fishery_world

  bilevel:
    outer_iters: 10

  ray:
    device: cpu
    num_cpus: 8
    omp_threads: 1
    logging_level: ERROR
    runtime_env:
      excludes:
        - wandb/
        - .git/
        - .venv/
        - __pycache__/
        - ray_results/
        - runs/

  outer_optimizer:
    type: ES
    training:
      dimension: 5
      pop_size: 16
      sigma: 0.15
      mean_lr: 0.1
      sigma_lr: 0.05
      min_sigma: 1e-3
      max_sigma: 0.5

    environment:
      env: FisheryRegulatorEnv
      train_iters: 100
      env_config:
        mechanism_space:
          fixed_quota: 0.2
          prop_quota: 0.1
          min_stock: 0.1
          fine_amount: 1.0
          ban_period: 2

        ecology_cfg:
          sus_weight: 5.0
          sus_threshold: 0.1

  inner_optimizer:
    type: PPO

    environment:
      env: FisheryRegulatedEnv
      horizon: 200
      env_config:
        ecology_cfg:
          algae_init: 1.0
          fish_init: 0.5
          alpha: 1.0
          beta: 0.5
          delta: 0.5
          gamma: 1.0
          dt: 0.05
        seed: 0

    framework:
      framework: torch

    env_runners:
      num_env_runners: 0

    resources:
      num_gpus: 0
      num_cpus_for_driver: 1
      num_cpu_per_worker: 1

    training:
      gamma: 0.99
      train_batch_size: 1000
      minibatch_size: 128
      lr: 3e-4

    evaluation:
      evaluation_interval: 1
      evaluation_duration: 5
      evaluation_duration_unit: episodes
      evaluation_parallel_to_training: false
      always_attach_evaluation_results: true
      evaluation_config:
        explore: false

    agents:
      fisher:
        count: 5
        policy: fisher_policy
        observation_space:
          fish:
            type: Box
            low: 0.0
            high: float32_max
            shape: [1]
            dtype: float32
          algae:
            type: Box
            low: 0.0
            high: float32_max
            shape: [1]
            dtype: float32

        action_space:
          fish_harvest:
            type: Box
            low: 0.0
            high: float32_max
            shape: [1]
            dtype: float32

    api_stack:
      enable_rl_module_and_learner: false
      enable_env_runner_and_connector_v2: false

    fault_tolerance:
      restart_failed_env_runners: false
