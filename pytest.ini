[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --cov=core
    --cov-report=term-missing
testpaths = 
    tests
python_files =
    test_*.py
markers =
    unit: fast, isolated tests
    integration: multi-component tests
    notebook: executes a tutorial notebook end-to-end (slow)
pythonpath = .